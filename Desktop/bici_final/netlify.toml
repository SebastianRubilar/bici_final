[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/strava/*"
  to = "/.netlify/functions/strava/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh"
  status = 200
  force = true
